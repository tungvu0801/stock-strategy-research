# Stock Agent CI (Stage 6.0.3: parallel suites)
#
# The pytest suite runs as five parallel jobs on GitHub-hosted Windows runners (the application targets Windows); every
# tests/test_*.py file belongs to exactly one job through .github/ci/pytest_groups.json, which scripts/ci_pytest_groups.py and
# tests/test_ci_groups_603.py verify, so a new test file that belongs to no group fails CI instead of silently never running.
# The Node tests and the browser harness run as their own jobs. "CI Success" is the one stable status that is green only when every
# job succeeded.
#
# Nothing here needs a secret or a .env file: tests/conftest.py blocks every socket connection and replaces the Alpaca read-only adapter
# and both Stage 4.6B paper-order wires with tripwires; the harness runs against a simulated world and a guarded local server. No
# repository secret is read or passed to any step. No real broker, paper or live, can be reached from CI.
#
# Line endings: .gitattributes checks the tree out exactly as the byte-pinned freeze tests expect, whatever the runner's core.autocrlf
# setting is (Git for Windows on the runner defaults to core.autocrlf=true).
name: Stock Agent CI

on:
  push:
    branches:
      - main
      - stage-46b
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  # The runner's stdout is a pipe (cp1252 by default on Windows); the suites print unicode such as masked account numbers (••••1234),
  # so give the interpreter's std streams UTF-8. Test behaviour is unaffected.
  PYTHONIOENCODING: utf-8

jobs:
  pytest:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # pytest's tmp_path (where most suites keep their SQLite databases) defaults to the profile's temp folder on the runner's OS disk, where
      # the SQLite-heavy suites measured 6-25x slower than locally; the runner's own temp folder is on its work disk, like the checkout.
      TEMP: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
    strategy:
      fail-fast: false                      # one PR run shows every failing suite, not just the first
      matrix:
        include:
          - suite: core
            name: Pytest Core
          - suite: execution
            name: Pytest Execution
          - suite: account
            name: Pytest Account & Cash Flow
          - suite: paper
            name: Pytest Paper & Portfolio
          - suite: research
            name: Pytest Research
          - suite: campaign
            name: Pytest Model Campaign
          - suite: runner
            name: Pytest Runner & Smoke
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # Full history: the freeze tests read pinned prior-stage files with `git show <commit>:<path>`; a depth-1 checkout has no such commit.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Verify the CI test manifest covers every pytest file
        run: python scripts/ci_pytest_groups.py check

      - name: Stage 4.6B tests (manual Alpaca PAPER orders - fakes only)
        if: matrix.suite == 'paper'
        run: python -m pytest tests/test_alpaca_orders_46b.py -q

      - name: Run the suite
        run: python scripts/ci_pytest_groups.py run ${{ matrix.suite }} -- -q -ra --junitxml=junit-${{ matrix.suite }}.xml

      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.suite }}
          path: junit-${{ matrix.suite }}.xml
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend Tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # No package.json / lockfile: the tests use only node:test and node:assert, nothing is installed, so there is nothing to cache.

      - name: Node tests
        run: node --test "tests/frontend/*.test.cjs"

  harness:
    name: Browser Harness
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TEMP: ${{ runner.temp }}              # the harness world's SQLite database lives in a temp folder too (see the pytest job)
      TMP: ${{ runner.temp }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install requirements
        # The harness world is built from the test fixtures (tests/pf_fixtures.py, tests/alpaca_order_fakes.py, tests/test_explain_38.py ...),
        # which import pytest, so the dev requirements are needed here as well.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Browser harness (headless Edge on the runner image, simulated world, guarded local server)
        run: python -m browser_tests.run --out browser-harness-artifacts

      - name: Upload harness artifacts (screenshots, results.json, harness.log - synthetic data only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-harness-artifacts
          path: browser-harness-artifacts
          if-no-files-found: ignore
          retention-days: 14

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [pytest, frontend, harness]
    if: always()                              # runs even when a dependency failed, so the status is red instead of missing
    steps:
      - name: Every job succeeded
        run: |
          echo "pytest:   ${{ needs.pytest.result }}"
          echo "frontend: ${{ needs.frontend.result }}"
          echo "harness:  ${{ needs.harness.result }}"
          test "${{ needs.pytest.result }}" = "success"
          test "${{ needs.frontend.result }}" = "success"
          test "${{ needs.harness.result }}" = "success"
